services:
  - type: web
    name: umt-team-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./umt_portal.db
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
